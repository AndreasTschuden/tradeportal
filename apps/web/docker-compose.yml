services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Europe/Vienna}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      TZ: ${TZ:-Europe/Vienna}
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - default
      - web
    labels:
      traefik.enable: "true"
      traefik.docker.network: web
      traefik.http.routers.pgadmin.rule: Host(`${PGADMIN_HOST}`)
      traefik.http.routers.pgadmin.entrypoints: websecure
      traefik.http.routers.pgadmin.tls: "true"
      traefik.http.routers.pgadmin.tls.certresolver: letsencrypt
      traefik.http.services.pgadmin.loadbalancer.server.port: "80"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BASE_URL: ${BASE_URL}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL}
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
        DATABASE_URL: ${DATABASE_URL}
        DIRECT_URL: ${DIRECT_URL}
        DATABASE_URL_COMPANY: ${DATABASE_URL_COMPANY}
        DATABASE_URL_BETTER_AUTH: ${DATABASE_URL_BETTER_AUTH}
        RESEND_API_KEY: ${RESEND_API_KEY}
        RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
        NEXT_PUBLIC_CAPTCHA_SITE_KEY: ${NEXT_PUBLIC_CAPTCHA_SITE_KEY}
        CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY}
        STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
        STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY}
        STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
        STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET}
        STRIPE_TRADE_PORTAL_FEE: ${STRIPE_TRADE_PORTAL_FEE}
        MINIO_BUCKET_CUSTOMER_ACCESS_KEY: ${MINIO_BUCKET_CUSTOMER_ACCESS_KEY}
        MINIO_BUCKET_CUSTOMER_SECRET_KEY: ${MINIO_BUCKET_CUSTOMER_SECRET_KEY}
        MINIO_BUCKET_COMPANY_ACCESS_KEY: ${MINIO_BUCKET_COMPANY_ACCESS_KEY}
        MINIO_BUCKET_COMPANY_SECRET_KEY: ${MINIO_BUCKET_COMPANY_SECRET_KEY}
        NEXT_PUBLIC_MINIO_PICTURE_BASE_URL: ${NEXT_PUBLIC_MINIO_PICTURE_BASE_URL}
    environment:
      NODE_ENV: production
      CI: "true"
      BASE_URL: ${BASE_URL}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      DATABASE_URL_COMPANY: ${DATABASE_URL_COMPANY}
      DATABASE_URL_BETTER_AUTH: ${DATABASE_URL_BETTER_AUTH}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      NEXT_PUBLIC_CAPTCHA_SITE_KEY: ${NEXT_PUBLIC_CAPTCHA_SITE_KEY}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET}
      STRIPE_TRADE_PORTAL_FEE: ${STRIPE_TRADE_PORTAL_FEE}
      MINIO_BUCKET_CUSTOMER_ACCESS_KEY: ${MINIO_BUCKET_CUSTOMER_ACCESS_KEY}
      MINIO_BUCKET_CUSTOMER_SECRET_KEY: ${MINIO_BUCKET_CUSTOMER_SECRET_KEY}
      MINIO_BUCKET_COMPANY_ACCESS_KEY: ${MINIO_BUCKET_COMPANY_ACCESS_KEY}
      MINIO_BUCKET_COMPANY_SECRET_KEY: ${MINIO_BUCKET_COMPANY_SECRET_KEY}
      NEXT_PUBLIC_MINIO_PICTURE_BASE_URL: ${NEXT_PUBLIC_MINIO_PICTURE_BASE_URL}
    command: ["pnpm", "start"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - web
    labels:
      traefik.enable: "true"
      traefik.docker.network: web
      traefik.http.routers.app.rule: Host(`${APP_HOST}`)
      traefik.http.routers.app.entrypoints: websecure
      traefik.http.routers.app.tls: "true"
      traefik.http.routers.app.tls.certresolver: letsencrypt
      traefik.http.services.app.loadbalancer.server.port: "3000"

networks:
  web:
    external: true

volumes:
  postgres_data:
  pgadmin_data: