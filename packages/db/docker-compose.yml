name: tradeportal
 
services:

  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/certs:ro
      - ./dynamic:/dynamic:ro
      - ./letsencrypt:/letsencrypt
    command:
      # EntryPoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      # Attach the static configuration tls.yaml file that contains the tls configuration settings
      - "--providers.file.filename=/dynamic/tls.yaml"
      # Providers 
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=web"
      # API & Dashboard 
      - "--api.dashboard=true"
      - "--api.insecure=false"
      # Observability 
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--metrics.prometheus=true"
      - "--certificatesresolvers.le.acme.email=schauby@edu.htl-villach.at"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json" # Path inside container volume
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      # Optionally make 'le' the default resolver for TLS-enabled routers
      - "--entrypoints.websecure.http.tls.certresolver=le"
  # Traefik Dynamic configuration via Docker labels
    labels:
      # Enable self‑routing
      - "traefik.enable=true"
      # Dashboard router
      - "traefik.http.routers.dashboard.rule=Host(`traefik.reactor-core.de`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"
      # Basic‑auth middleware
      - traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_MIDDLEWARE_HASH}
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth@docker"

  postgres:
    image: postgres:18-alpine
    container_name: tradeportal-postgres
    environment:
      POSTGRES_DB: tradeportal
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Vienna
    volumes:
      - tradeportal_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      TZ: Europe/Vienna
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - default
      - web
    labels:
      traefik.enable: "true"
      traefik.docker.network: web
      traefik.http.routers.pgadmin.rule: Host(`pgadmin.reactor-core.de`)
      traefik.http.routers.pgadmin.entrypoints: websecure
      traefik.http.routers.pgadmin.tls: "true"
      traefik.http.routers.pgadmin.tls.certresolver: letsencrypt
      traefik.http.services.pgadmin.loadbalancer.server.port: "80"
  
  minio:
      image: quay.io/minio/aistor/minio
      container_name: tradeportal-buckets
      environment:
        MINIO_ROOT_USER: ${MINIO_USER}
        MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      ports:
        - "8999:9000" 
        - "9001:9001"
      volumes:
        - minio_data:/mnt/data
        - minio_license:/licenses  
        - minio_certs:/etc/minio/certs
      command: minio server /mnt/data --license /licenses/minio.license --certs-dir /etc/minio/certs


volumes:
  tradeportal_postgres_data:
  minio_data:
  minio_license:
  minio_certs:
  pgadmin_data:

networks:
  web:
    name: web